<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD2PDF - Markdown to Paginated Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <button id="themeToggle" class="theme-toggle" aria-label="Switch to light theme" title="Switch to light theme">
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z"></path>
            </svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="12" y1="20" x2="12" y2="22"></line>
                <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"></line>
                <line x1="17.7" y1="17.7" x2="19.1" y2="19.1"></line>
                <line x1="2" y1="12" x2="4" y2="12"></line>
                <line x1="20" y1="12" x2="22" y2="12"></line>
                <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"></line>
                <line x1="17.7" y1="6.3" x2="19.1" y2="4.9"></line>
            </svg>
        </button>

        <div class="toolbar">
            <h1>MD2PDF</h1>
            <div class="controls">
                <input type="file" id="uploadFile" accept=".md,.txt" class="hidden-file-input" aria-label="Upload markdown file" multiple>
                <button id="uploadBtn">Upload</button>
                <button id="saveBtn">Save</button>
                <button id="exportPdfBtn">Export PDF</button>
                <button id="mathToggle">Math: HTML</button>
                <label class="control-label">
                    Font:
                    <select id="fontSizeSelect">
                        <option value="10">10px</option>
                        <option value="12" selected>12px</option>
                        <option value="14">14px</option>
                        <option value="16">16px</option>
                        <option value="18">18px</option>
                        <option value="20">20px</option>
                    </select>
                </label>
                <label class="control-label">
                    Margin:
                    <select id="marginSelect">
                        <option value="15">Narrow (15mm)</option>
                        <option value="20" selected>Medium (20mm)</option>
                        <option value="25.4">Wide (1 inch)</option>
                        <option value="30">Extra Wide (30mm)</option>
                    </select>
                </label>
                <label class="control-label">
                    Page:
                    <select id="pageSizeSelect">
                        <option value="a4" selected>A4 (210 x 297mm)</option>
                        <option value="letter">Letter (8.5 x 11in)</option>
                        <option value="legal">Legal (8.5 x 14in)</option>
                        <option value="tabloid">Tabloid (11 x 17in)</option>
                        <option value="a3">A3 (297 x 420mm)</option>
                    </select>
                </label>
            </div>
        </div>

        <div id="workspaceShell" class="workspace-shell">
            <aside id="documentSidebar" class="document-sidebar">
                <div class="document-sidebar-header">
                    <button id="sidebarToggleBtn" class="sidebar-toggle-btn" aria-label="Collapse document list" title="Collapse document list">&lt;</button>
                    <h3 class="document-sidebar-title">Open Files</h3>
                </div>
                <div id="documentList" class="document-list" aria-label="Open markdown files"></div>
            </aside>

            <div id="mainContainer" class="main-container">
                <div class="editor-pane">
                    <h3>Markdown Editor</h3>
                    <textarea id="markdownEditor" placeholder="Enter your markdown here...

# Welcome to MD2PDF

This is a markdown editor with live preview.

You can write:
- Lists
- *Italic* and **bold** text
- Inline math: $E = mc^2$
- Display math:

$$
\\int_{-\\infty}^{\\infty} e^{-x^2} dx = \\sqrt{\\pi}
$$

## Tables

| Feature | Status |
|---------|--------|
| Editing | Yes |
| Preview | Yes |
| Math    | Yes |
"></textarea>
                </div>

                <div id="paneDivider" class="pane-divider" role="separator" aria-label="Resize panes" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>

                <div class="preview-pane">
                    <h3>Page Preview</h3>
                    <div id="previewViewport" class="preview-viewport">
                        <div class="preview-controls" aria-label="Preview zoom controls">
                            <button id="fitWidthBtn" class="preview-ghost-button is-active" title="Fit to width">Fit Width</button>
                            <button id="fitPageBtn" class="preview-ghost-button" title="Fit whole page">Fit Page</button>
                            <span id="zoomReadout" class="preview-zoom-readout" aria-live="polite">100%</span>
                            <button id="zoomOutBtn" class="preview-ghost-button" title="Zoom out" aria-label="Zoom out">-</button>
                            <button id="zoomInBtn" class="preview-ghost-button" title="Zoom in" aria-label="Zoom in">+</button>
                        </div>

                        <div id="previewCanvasSizer" class="preview-canvas-sizer">
                            <div id="previewContainer">
                                <div class="page">
                                    <div class="page-content">
                                        <p>Preview will appear here...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="exportModalBackdrop" class="export-modal-backdrop" hidden>
        <div class="export-modal" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
            <div class="export-modal-header">
                <h2 id="exportModalTitle">Export PDF</h2>
                <button id="exportModalCloseBtn" class="export-close-btn" type="button" aria-label="Close export dialog" title="Close export dialog">&times;</button>
            </div>

            <p id="exportModalSummary" class="export-modal-summary">
                Choose what to export, then start. Progress updates will appear below while files are processed.
            </p>

            <fieldset class="export-scope-group">
                <legend>Export scope</legend>
                <label class="export-scope-option">
                    <input id="exportScopeCurrent" type="radio" name="exportScope" value="current" checked>
                    <span id="exportScopeCurrentLabel">Current file</span>
                </label>
                <label class="export-scope-option">
                    <input id="exportScopeAll" type="radio" name="exportScope" value="all">
                    <span id="exportScopeAllLabel">All open files</span>
                </label>
            </fieldset>

            <div class="export-progress-panel" aria-live="polite">
                <div class="export-progress-head">
                    <span id="exportProgressText">Ready to export</span>
                    <span id="exportProgressCount">0 / 0</span>
                </div>
                <div class="export-progress-track">
                    <div id="exportProgressBar" class="export-progress-bar"></div>
                </div>
            </div>

            <div id="exportLog" class="export-log" role="status" aria-live="polite"></div>

            <div class="export-modal-actions">
                <button id="exportStartBtn" type="button">Start Export</button>
                <button id="exportCancelBtn" type="button" disabled>Cancel</button>
                <button id="exportDismissBtn" type="button">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
